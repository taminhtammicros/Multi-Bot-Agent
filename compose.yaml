services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hub_local_dev}
      POSTGRES_DB: zalo_hub
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - hub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d zalo_hub"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  hub_postgres:
